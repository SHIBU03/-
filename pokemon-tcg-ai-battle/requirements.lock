# Pinned dependencies for the cabt competition.
#
# Install:
#   pip install --ignore-installed blinker -r requirements.lock
#
# Notes:
# - The cabt environment is BUNDLED inside kaggle-environments 1.30.1, so
#   make("cabt") works out of the box (no separate competition download needed).
# - `--ignore-installed blinker` is required on Debian-based images where the
#   system `blinker` package cannot be uninstalled by pip (RECORD file missing).
# - The native engine (cg/libcg.so) ships inside the submission and inside the
#   cabt env; it is loaded once per process.

kaggle-environments==1.30.1
